name: Auditoria de planos Casa de Lux
on:
  push:
    paths:
      - '.github/workflows/auditoria-planos-lux.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow ImageHash scipy numpy
      - name: Inspeccionar resolución y similitud de 50 imágenes
        run: python casa-lux/depurar_planos.py
      - name: Guardar informe y vista de comparación
        run: |
          git config user.name "Casa de Lux"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/auditoria_planos.json casa-lux/auditoria_planos.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Auditoria de resoluciones y planos repetidos"
          git push
