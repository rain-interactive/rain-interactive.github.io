name: Casa de Lux · 66 miniaturas y bordes negros
on:
  push:
    paths:
      - '.github/workflows/lux-indice-66.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lux-index-66
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Cambiar los 24 rellenos difuminados y crear hoja numerada
        run: python casa-lux/crear_indice_66_y_corregir_bordes.py
      - name: Verificar negro en los bordes y resolución Full HD
        run: |
          python - <<'PY'
          from PIL import Image
          import json,re,io,base64
          from pathlib import Path
          root=Path('casa-lux')
          report=json.loads((root/'bordes_negros_originales.json').read_text('utf8'))
          assert report['modified_indices']==list(range(1,25))
          sheet=Image.open(root/'Casa_de_Lux_66_planos_numerados.jpg')
          assert sheet.width>2000 and sheet.height>2500,sheet.size
          count=0
          for p in sorted((root/'assets').glob('pack_*.js')):
              for idx,b64 in re.findall(r'window\.__luxImages\[(\d+)\]="data:image/webp;base64,([A-Za-z0-9+/=]+)";',p.read_text('utf8')):
                  idx=int(idx)
                  with Image.open(io.BytesIO(base64.b64decode(b64))) as im:
                      assert im.size==(1920,1080),(idx,im.size)
                      if idx<24:
                          for point in [(0,540),(250,540),(1919,540),(1700,540)]:
                              assert max(im.convert('RGB').getpixel(point))<8,(idx,point)
                  count+=1
          assert count==66,count
          print("66 planos verificados; 24 originales con borde negro; JPG completo",sheet.size)
          PY
      - name: Publicar JPG para revisar los planos
        run: |
          git config user.name "Casa de Lux"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/assets/pack_*.js casa-lux/Casa_de_Lux_66_planos_numerados.jpg casa-lux/bordes_negros_originales.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar 66 miniaturas numeradas y eliminar blur de fotos originales"
            git push
          fi
