const saved=new WeakMap();
function updateValue(node,key,read,write){
  const current=read();if(!current)return;
  let memory=saved.get(node);if(!memory){memory={};saved.set(node,memory)}
  let item=memory[key];
  if(!item||current!==item.rendered)item=memory[key]={original:current,rendered:current};
  const translated=window.commandosT(item.original);
  item.rendered=translated;if(current!==translated)write(translated);
}
function translate(root){
  if(root.nodeType===3){
    if(!root.parentElement?.closest('script,style,#commandos-language'))updateValue(root,'text',()=>root.nodeValue,v=>root.nodeValue=v);
    return;
  }
  if(root.nodeType!==1&&root.nodeType!==9)return;
  if(root.nodeType===1){
    if(root.matches('script,style,#commandos-language'))return;
    for(const attr of ['aria-label','title','placeholder','alt'])
      if(root.hasAttribute(attr))updateValue(root,attr,()=>root.getAttribute(attr),v=>root.setAttribute(attr,v));
  }
  for(const child of root.childNodes)translate(child);
}
function select(next){
  language=next;try{localStorage.setItem(KEY,language)}catch{}
  document.documentElement.lang=language;
  translate(document.body);translate(document.querySelector('title'));
  document.querySelectorAll('#commandos-language button').forEach(b=>{
    const active=b.dataset.language===language;b.setAttribute('aria-pressed',String(active));b.style.color=active?'#75d2c7':'#aaa';
  });
}
function mount(){
  const bar=document.createElement('div');bar.id='commandos-language';bar.setAttribute('role','group');bar.setAttribute('aria-label','Idioma / Language');
  const screen=document.querySelector('#screen');
  bar.style.cssText='position:'+ (screen?'absolute':'fixed') +';'+(screen?'bottom:8px;right:8px;':'top:10px;right:10px;')+'z-index:2147483647;display:flex;gap:3px;background:#101923ee;border:1px solid #aaa;border-radius:3px;padding:2px;';
  for(const code of ['es','en']){
    const b=document.createElement('button');b.type='button';b.dataset.language=code;b.textContent=code.toUpperCase();
    b.style.cssText='width:auto;margin:0;min-width:36px;min-height:32px;padding:5px;border:0;background:transparent;font:bold 12px monospace;letter-spacing:0;cursor:pointer;touch-action:manipulation';
    b.onclick=()=>select(code);bar.append(b);
  }
  (screen||document.body).append(bar);
  // The cover overlay is outside the cabinet, and sits above all other controls.
  const cover=document.querySelector('#commandos-cover-start');if(cover)cover.append(bar);
  select(language);
  new MutationObserver(records=>{
    for(const item of records){
      if(item.type==='childList')for(const node of item.addedNodes)translate(node);

    }
  }).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title','placeholder','alt']});
  if(cover)new MutationObserver(()=>{if(!cover.isConnected&&bar.parentNode===cover)(screen||document.body).append(bar)}).observe(document.body,{childList:true});
}
