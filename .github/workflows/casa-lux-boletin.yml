name: Cuaderno cultural Lux - noticias
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/casa-lux-boletin.yml'
permissions:
  contents: write
concurrency:
  group: casa-lux-noticias
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actualizar titulares de las agendas y becas
        run: python casa-lux/actualizar_boletin.py
      - name: Publicar boletin si hay novedades
        run: |
          git config user.name "Lux Cultural"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/boletin.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización automática del cuaderno cultural"
            git push
          fi
