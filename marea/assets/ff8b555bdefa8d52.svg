<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 640" role="img" aria-labelledby="clubIslandTitle clubIslandDesc">
  <title id="clubIslandTitle">Marea Club Surf House</title>
  <desc id="clubIslandDesc">Un pequeño islote rodeado de espuma, con palmeras, una caseta de madera turquesa, tejado violeta y las tablas Coral, Neón, Abisal y Sol. El nombre está pintado en blanco con sombra rosa en la fachada.</desc>
