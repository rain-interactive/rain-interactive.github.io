const KEY='commandos-language',pairs=[["Un jinete. Un camello. Cinco zonas de combate.","One rider. One camel. Five combat zones."],["Cinco niveles: zoco, puerto, distrito industrial, montaña y cueva. Sobrevive a las oleadas y derrota al blindado de cada zona para avanzar.","Five stages: bazaar, harbor, industrial district, mountain and cave. Survive the waves and defeat each zone’s armored boss to advance."],["Ficción satírica de acción; no recrea hechos históricos. Los desarrolladores estamos a favor de la liberación de Palestina.","Satirical action fiction; it does not recreate historical events. The developers support the liberation of Palestine."],["Mantén pulsada la mitad izquierda para retroceder.","Hold the left half of the screen to move back."],["Mantén pulsada la mitad derecha para avanzar.","Hold the right half of the screen to move forward."],["Disparas automáticamente. Sin botones ni indicadores.","You fire automatically. No buttons or indicators."],["Al morir eliges tu arma para la siguiente partida.","After dying, choose your weapon for the next run."],["Elige una mejora. La oleada está detenida.","Choose an upgrade. The wave is paused."],["Has superado los cinco niveles y el último combate de la cueva.","You cleared all five stages and the final battle in the cave."],["El desierto no perdona. Cambia tus mejoras y vuelve a intentarlo.","The desert shows no mercy. Change your upgrades and try again."],["Disparas un 22% más rápido.","You fire 22% faster."],["Una granada extra. Explosiones más grandes.","An extra grenade. Bigger explosions."],["Cada bala hace más daño.","Each bullet deals more damage."],["Un proyectil adicional por disparo (máx. 5).","One extra projectile per shot (max. 5)."],["Un colmillo gira a tu alrededor y golpea enemigos.","A fang orbits you and hits enemies."],["Atraes experiencia desde más lejos.","You attract experience from farther away."],["Más velocidad y recuperas 2 puntos de vida.","More speed and recover 2 health points."],["Despliegas una mina cada 7 s; más mejoras, más daño.","Deploy a mine every 7 s; more upgrades, more damage."],["Aumenta tu vida máxima y recuperas 3 puntos.","Increase maximum health and recover 3 health points."],["Contraseña incorrecta. Inténtalo de nuevo.","Incorrect password. Try again."],["Gira el móvil para jugar en horizontal.","Rotate your phone to play in landscape."],["Juego de supervivencia con jinete y camello","Survival game with a rider and camel"],["VÍDEO DE VICTORIA DESBLOQUEADO","VICTORY VIDEO UNLOCKED"],["VER VÍDEO DE RECOMPENSA","WATCH REWARD VIDEO"],["RECOMPENSA DESBLOQUEADA","REWARD UNLOCKED"],["Vídeo de victoria: Poker Face","Victory video: Poker Face"],["Creado por nachommmartinez","Created by nachommmartinez"],["Abrir vídeo aparte","Open video separately"],["Vídeo que compartiste","Shared video"],["LA CUEVA · NIVEL FINAL COMPLETADO","THE CAVE · FINAL STAGE COMPLETE"],["LA NOCHE TE HA ALCANZADO","THE NIGHT HAS CAUGHT UP WITH YOU"],["TERRORISTA ABATIDO","TERRORIST DOWN"],["FIN DEL COMBATE","GAME OVER"],["VOLVER A COMBATIR","FIGHT AGAIN"],["ENTRAR EN COMBATE","ENTER COMBAT"],["COMBATE DETENIDO","COMBAT PAUSED"],["CONTRASEÑA DE ACCESO","ACCESS PASSWORD"],["Prototipo en desarrollo.","Prototype in development."],["Supervivencia lateral","Side-scrolling survival"],["JUGAR AL JUEGO","PLAY GAME"],["Volver a Rain","Back to Rain"],["Abriendo…","Opening…"],["SUPERVIVENCIA ARCADE","ARCADE SURVIVAL"],["SUPERVIVENCIA","SURVIVAL"],["PROTOTIPO","PROTOTYPE"],["PATRULLA DEL ZOCO","BAZAAR PATROL"],["GUARDIA DEL PUERTO","HARBOR GUARD"],["MÁQUINA DE ASEDIO","SIEGE ENGINE"],["ARTILLERÍA DE MONTAÑA","MOUNTAIN ARTILLERY"],["GUARDIÁN DE LA CUEVA","CAVE GUARDIAN"],["BLINDADO DESTRUIDO","ARMORED VEHICLE DESTROYED"],["DISTRITO INDUSTRIAL","INDUSTRIAL DISTRICT"],["PASO DE MONTAÑA","MOUNTAIN PASS"],["EL ZOCO","THE BAZAAR"],["EL PUERTO","THE HARBOR"],["LA CUEVA","THE CAVE"],["FUSIL · CADENCIA","RIFLE · FIRE RATE"],["COLMILLOS","FANGS"],["DOBLE RÁFAGA","DOUBLE BURST"],["LOBO GRIS","GRAY WOLF"],["EL FARO DE LOS PERDIDOS","THE LIGHTHOUSE OF THE LOST"],["EL FARO","THE LIGHTHOUSE"],["SALIR DEL EXILIO","ESCAPE EXILE"],["MINAS DE PROXIMIDAD","PROXIMITY MINES"],["PIEL DE ESPARTANO","SPARTAN SKIN"],["EXPERIENCIA RECUPERADA","EXPERIENCE RECOVERED"],["DESBLOQUEAR","UNLOCK"],["BLOQUEADA","LOCKED"],["DISPAROS/S","SHOTS/S"],["disparos/s","shots/s"],["EXPLOSIVA","EXPLOSIVE"],["PERFORANTE","ARMOR-PIERCING"],["BALÍSTICA","BALLISTIC"],["explosivo","explosive"],["perforante","armor-piercing"],["balístico","ballistic"],["DAÑO","DAMAGE"],["Daño","Damage"],["NIVEL","LEVEL"],["BAJAS","KILLS"],["PUNTOS","POINTS"],["RÉCORD","BEST"],["VIDA","HEALTH"],["GRANADAS","GRENADES"],["SONIDO: NO","SOUND: OFF"],["SONIDO: SÍ","SOUND: ON"],["Música: apagada","Music: off"],["Música: encendida","Music: on"],["Reintentar música","Retry music"],["Activar sonido","Enable sound"],["Silenciar sonido","Mute sound"],["Pausar partida","Pause game"],["Pantalla completa","Fullscreen"],["CONTINUAR","RESUME"],["PAUSA","PAUSE"],["VOLVER","BACK"],["ENTRAR","ENTER"],["ZOCO / PUERTO / EXILIO · FICCIÓN SDJ","BAZAAR / HARBOR / EXILE · SDJ FICTION"]],weapons=[["PP7 Special Issue","PP7 de servicio"],["PP7 Silenced","PP7 silenciada"],["KF7 Soviet","KF7 soviético"],["D5K Silenced","D5K silenciada"],["US AR33 Assault","US AR33 de asalto"],["Automatic Shotgun","Escopeta automática"],["Shotgun","Escopeta"],["Sniper Rifle","Fusil de francotirador"],["Grenade Launcher","Lanzagranadas"],["Rocket Launcher","Lanzacohetes"],["Military Laser","Láser militar"],["Golden Gun","Pistola dorada"],["Silver PP7","PP7 plateada"],["Gold PP7","PP7 dorada"],["Throwing Knife","Cuchillo arrojadizo"],["Hunting Knife","Cuchillo de caza"],["Watch Laser","Reloj láser"],["Timed Mine","Mina temporizada"],["Proximity Mine","Mina de proximidad"],["Remote Mine","Mina remota"],["Tank Cannon","Cañón de tanque"]];
let language='es';try{language=localStorage.getItem(KEY)==='en'?'en':'es'}catch{}
const escape=s=>[...s].map(c=>'.*+?^${}()|[]'.includes(c)||c.charCodeAt(0)===92?String.fromCharCode(92)+c:c).join('');
function make(entries){
  const map=new Map(entries),pattern=new RegExp([...map.keys()].sort((a,b)=>b.length-a.length).map(escape).join('|'),'g');
  return value=>String(value).replace(pattern,key=>map.get(key));
}
pairs.push(['Supervivencia','Survival']);
const english=make(pairs),spanishWeapons=make(weapons);
window.commandosT=value=>language==='en'?english(value):spanishWeapons(value);
const saved=new WeakMap();
function updateValue(node,key,read,write){
  const current=read();if(!current)return;
  let memory=saved.get(node);if(!memory){memory={};saved.set(node,memory)}
  let item=memory[key];
  if(!item||current!==item.rendered)item=memory[key]={original:current,rendered:current};
  const translated=window.commandosT(item.original);
  item.rendered=translated;if(current!==translated)write(translated);
}
function translate(root){
  if(root.nodeType===3){
    if(!root.parentElement?.closest('script,style,#commandos-language'))updateValue(root,'text',()=>root.nodeValue,v=>root.nodeValue=v);
    return;
  }
  if(root.nodeType!==1&&root.nodeType!==9)return;
  if(root.nodeType===1){
    if(root.matches('script,style,#commandos-language'))return;
    for(const attr of ['aria-label','title','placeholder','alt'])
      if(root.hasAttribute(attr))updateValue(root,attr,()=>root.getAttribute(attr),v=>root.setAttribute(attr,v));
  }
  for(const child of root.childNodes)translate(child);
}
function select(next){
  language=next;try{localStorage.setItem(KEY,language)}catch{}
  document.documentElement.lang=language;
  translate(document.body);translate(document.querySelector('title'));
  document.querySelectorAll('#commandos-language button').forEach(b=>{
    const active=b.dataset.language===language;b.setAttribute('aria-pressed',String(active));b.style.color=active?'#75d2c7':'#aaa';
  });
}
function mount(){
  const bar=document.createElement('div');bar.id='commandos-language';bar.setAttribute('role','group');bar.setAttribute('aria-label','Idioma / Language');
  const screen=document.querySelector('#screen');
  bar.style.cssText='position:'+ (screen?'absolute':'fixed') +';'+(screen?'bottom:8px;right:8px;':'top:10px;right:10px;')+'z-index:2147483647;display:flex;gap:3px;background:#101923ee;border:1px solid #aaa;border-radius:3px;padding:2px;';
  for(const code of ['es','en']){
    const b=document.createElement('button');b.type='button';b.dataset.language=code;b.textContent=code.toUpperCase();
    b.style.cssText='width:auto;margin:0;min-width:36px;min-height:32px;padding:5px;border:0;background:transparent;font:bold 12px monospace;letter-spacing:0;cursor:pointer;touch-action:manipulation';
    b.onclick=()=>select(code);bar.append(b);
  }
  (screen||document.body).append(bar);
  // The cover overlay is outside the cabinet, and sits above all other controls.
  const cover=document.querySelector('#commandos-cover-start');if(cover)cover.append(bar);
  select(language);
  new MutationObserver(records=>{
    for(const item of records){
      if(item.type==='childList')for(const node of item.addedNodes)translate(node);
      else translate(item.target);
    }
  }).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title','placeholder','alt']});
  if(cover)new MutationObserver(()=>{if(!cover.isConnected&&bar.parentNode===cover)(screen||document.body).append(bar)}).observe(document.body,{childList:true});
}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',mount,{once:true}):mount();
