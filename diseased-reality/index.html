<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DISEASED REALITY — El jardín de los nombres</title><body style="margin:0;background:#050308"><section id="access" style="max-width:420px;margin:15vh auto;padding:24px;color:#e8cde8;background:#100716;font:16px monospace"><h1>DISEASED REALITY</h1><form id="login"><label>USUARIO<input id="user" autocomplete="username" required style="display:block;width:95%;margin:10px 0;padding:12px"></label><label>CONTRASEÑA<input id="pass" type="password" autocomplete="current-password" required style="display:block;width:95%;margin:10px 0;padding:12px"></label><button style="padding:14px">ENTRAR</button><p id="error" role="alert"></p></form></section><div id="protected-game" hidden><div id="dr-game">
 <header><span>DISEASED REALITY <small>· 1995</small></span><div class="dr-top-actions"><button id="dr-sound" aria-pressed="false" aria-label="Activar alaridos">SONIDO OFF</button><button id="dr-full" aria-label="Pantalla completa">⛶</button><button id="dr-reset" aria-label="Volver al inicio">REINICIAR</button></div></header>
 <div class="dr-stage">
  <img id="dr-art" alt="Estás muerto. Un esqueleto descansa bajo un árbol." src="assets/opening-1995.webp">
  <canvas id="dr-world" width="400" height="300" hidden aria-label="Cementerio tridimensional: camina entre las lápidas y reúne tres recuerdos."></canvas>
  <div class="dr-scan"></div>
  <div id="dr-caption" hidden aria-live="polite"></div>
  <div id="dr-count" hidden>RECUERDOS 0 / 3</div>
  <div id="dr-cross" hidden>+</div>
 </div>
 <div class="dr-console"><p id="dr-line" aria-live="polite">Tu entierro es el comienzo.</p><button id="dr-action">COMENZAR</button></div>
 <div id="dr-controls" hidden>
  <div class="dr-stick-wrap"><button id="dr-move" class="dr-stick" aria-label="Joystick izquierdo: desplazamiento"><span class="dr-knob"></span></button><span>CAMINAR</span></div>
  <button id="dr-journal">DIARIO</button>
  <div class="dr-stick-wrap"><button id="dr-look" class="dr-stick" aria-label="Joystick derecho: mirar a los lados"><span class="dr-knob"></span></button><span>MIRAR</span></div>
 </div>
 <div id="dr-modal" hidden role="region" aria-labelledby="dr-modal-title"><h2 id="dr-modal-title">DIARIO SIN FECHA</h2><canvas id="dr-portrait" width="64" height="64" hidden aria-label="Retrato del personaje"></canvas><p id="dr-modal-text"></p><button id="dr-close">CERRAR</button></div>
</div>
<style>
#dr-game{position:relative;max-width:960px;margin:auto;background:#08070d;color:#e6d8d4;font:14px/1.5 'Courier New',monospace;overflow:hidden;color-scheme:dark}#dr-game *{box-sizing:border-box}#dr-game [hidden]{display:none!important}#dr-game header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0d0911;letter-spacing:.08em;font-size:12px}#dr-game small{color:#9b838f}#dr-game button{background:#1a101e;color:#f1ded9;border:1px solid #83516b;padding:12px 16px;font:inherit;cursor:pointer;touch-action:manipulation;min-height:44px}#dr-game button:hover{background:#372039}#dr-game button:focus-visible{outline:2px solid #f5b6ea;outline-offset:-3px}#dr-game header button{font-size:11px;padding:8px}#dr-game .dr-stage{position:relative;aspect-ratio:4/3;background:#08050c;overflow:hidden}#dr-art,#dr-world{width:100%;height:100%;display:block;object-fit:fill;image-rendering:pixelated}#dr-game .dr-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0003 3px 4px);opacity:.4}#dr-caption{position:absolute;left:9%;right:9%;bottom:9%;background:#020103;color:#eee0d4;padding:10px;text-align:center;font-size:clamp(12px,2.4vw,20px);white-space:pre-line;min-height:18%;display:flex;justify-content:center;align-items:center}#dr-count{position:absolute;top:12px;left:12px;font-size:11px;background:#0b0713c9;padding:6px 9px;color:#e3bbd7}#dr-cross{position:absolute;top:47%;left:49%;opacity:.6}#dr-game .dr-console{padding:12px 16px;border-top:1px solid #452439;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:88px}#dr-line{margin:0;max-width:65%;font-size:13px}#dr-action{flex-shrink:0}#dr-controls{padding:10px 16px 16px;display:flex;justify-content:space-between;gap:15px;border-top:1px solid #261723}#dr-game .dr-pad{display:grid;grid-template-columns:repeat(3,48px);gap:4px}#dr-game .dr-pad button{padding:9px;touch-action:none;font-size:19px;user-select:none}#dr-game .dr-help{font-size:11px;color:#bba6b4;text-align:right}#dr-journal{margin-top:10px;font-size:11px!important}#dr-modal{position:absolute;inset:15% 6% auto;max-height:75%;overflow:auto;padding:24px;background:#100c16;border:1px solid #b779a6;box-shadow:0 0 0 100vmax #000a;z-index:4}#dr-modal h2{font-size:17px;color:#db9dbf}#dr-modal p{white-space:pre-line;line-height:1.7}#dr-game .dr-console button{max-width:45%}@media(max-width:450px){#dr-game header{letter-spacing:0}#dr-line{font-size:12px}#dr-game .dr-console{padding:10px;gap:8px}#dr-action{font-size:12px;padding:10px}#dr-caption{bottom:8%;font-size:12px;padding:6px}#dr-modal{padding:16px;inset:8% 4% auto;max-height:84%}}
#dr-portrait{float:left;width:clamp(90px,25%,180px);height:auto;image-rendering:pixelated;margin:0 16px 10px 0;background:#0b0711}#dr-modal:after{content:"";display:block;clear:both}#dr-modal button{clear:both}#dr-world{filter:saturate(1.35)}

#dr-game{display:flex;flex-direction:column}#dr-game .dr-top-actions{display:flex;gap:6px}#dr-full{font-size:22px!important;min-width:44px}#dr-game header{flex-shrink:0}#dr-game .dr-stage{flex:1;min-height:0}#dr-game .dr-console{flex-shrink:0;min-height:76px}#dr-game.speaking .dr-console{display:none}#dr-game #dr-controls{position:absolute;inset:auto 0 8px;z-index:2;padding:8px 18px;border:0;display:flex;align-items:end;justify-content:space-between;pointer-events:none;background:none}#dr-game .dr-stick-wrap{display:grid;justify-items:center;gap:5px;color:#ddc3e9;font-size:10px;text-shadow:0 1px 3px #000}#dr-game .dr-stick{position:relative;width:112px;height:112px;border-radius:50%;border:1px solid #c894e77a;background:radial-gradient(circle,#6d258d29,#10071f80);touch-action:none;user-select:none;pointer-events:auto;padding:0;box-shadow:inset 0 0 20px #8b29b829}#dr-game .dr-stick:before,#dr-game .dr-stick:after{content:'';position:absolute;background:#d5a6e826;pointer-events:none}#dr-game .dr-stick:before{width:1px;top:12px;bottom:12px;left:50%}#dr-game .dr-stick:after{height:1px;left:12px;right:12px;top:50%}#dr-game .dr-knob{position:absolute;left:calc(50% - 20px);top:calc(50% - 20px);width:40px;height:40px;border-radius:50%;background:#a46ab7a8;border:1px solid #e5b9f5;box-shadow:0 0 14px #ad4af342;pointer-events:none}#dr-game #dr-journal{pointer-events:auto;font-size:10px!important;min-height:40px;padding:8px;background:#120a20b0;margin:0 0 4px}
#dr-game #dr-modal{position:relative;inset:auto;flex-shrink:0;max-height:240px;overflow:auto;padding:12px 14px;background:#09060ef5;border:0;border-top:1px solid #67406e;box-shadow:none;display:grid;grid-template-columns:48px 1fr auto;gap:4px 12px;align-items:center;z-index:3}#dr-game #dr-modal h2{grid-column:2;grid-row:1;font-size:11px;line-height:1.3;margin:0;color:#d9a2eb}#dr-game #dr-portrait{grid-column:1;grid-row:1/3;float:none;width:48px;height:48px;margin:0;background:#1b0a24;border:1px solid #74417f;image-rendering:pixelated}#dr-game #dr-modal-text{grid-column:2;grid-row:2;margin:0;font-size:14px;line-height:1.45;white-space:pre-line;text-shadow:0 1px 2px #000}#dr-game #dr-close{grid-column:3;grid-row:1/3;clear:none;max-width:140px;font-size:11px;padding:10px;min-height:44px}#dr-game #dr-modal:after{display:none}#dr-game #dr-modal.journal{max-height:340px}#dr-game:fullscreen{width:100vw;max-width:none;height:100dvh;margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#dr-game:fullscreen .dr-stage{aspect-ratio:auto}#dr-game:fullscreen #dr-world,#dr-game:fullscreen #dr-art{object-fit:contain}#dr-game.expanded{max-width:none;height:85dvh;min-height:420px}#dr-game.expanded .dr-stage{aspect-ratio:auto}#dr-game.expanded #dr-world,#dr-game.expanded #dr-art{object-fit:contain}
@media(max-width:500px){#dr-game #dr-controls{padding:6px 12px}#dr-game .dr-stick{width:90px;height:90px}#dr-game #dr-modal{grid-template-columns:36px 1fr;gap:4px 8px;padding:9px 10px;max-height:260px}#dr-game #dr-portrait{width:36px;height:36px}#dr-game #dr-modal-text{font-size:13px}#dr-game #dr-close{grid-column:2;grid-row:3;justify-self:end;min-height:40px;padding:8px 12px}#dr-game header{font-size:10px;padding:5px 9px}#dr-game header button{font-size:9px}#dr-count{top:6px;left:6px}#dr-game .dr-stage{min-height:270px}}
@media(max-height:500px) and (orientation:landscape){#dr-game:fullscreen header{position:absolute;top:0;left:0;right:0;z-index:4;background:#0c07126b;padding:2px 10px}#dr-game:fullscreen #dr-count{top:50px}#dr-game:fullscreen #dr-modal{max-height:140px}#dr-game:fullscreen .dr-stage{min-height:120px}#dr-game:fullscreen .dr-stick{width:88px;height:88px}}
@media(max-width:400px){#dr-game header{flex-wrap:wrap}#dr-game .dr-top-actions{margin-left:auto}#dr-game header>span{flex-basis:100%}}

<script>
(()=>{
const root=document.getElementById('dr-game'),q=s=>root.querySelector(s),art=q('#dr-art'),canvas=q('#dr-world'),ctx=canvas.getContext('2d'),line=q('#dr-line'),action=q('#dr-action'),caption=q('#dr-caption'),controls=q('#dr-controls'),count=q('#dr-count'),cross=q('#dr-cross'),modal=q('#dr-modal');
q('.dr-stage').appendChild(controls);
const sources={opening:'assets/opening-1995.webp',death:'assets/death-1995.webp',cemetery:'assets/cemetery-1995.webp',souls:'assets/souls-1995.webp',coven:'assets/coven-1995.webp'};
const images={};Object.entries(sources).forEach(([name,src])=>{const im=new Image();im.src=src;images[name]=im});
const pages=['Tu nombre ha llegado antes que tú.\nEl jardín lleva años soñando con tus huesos.','Buenas noches.\nLa causa de tu muerte todavía no ha ocurrido.','Tu cadáver ha sido asignado a otra persona.\nLos recuerdos pertenecen al propietario anterior.','Tu entierro comenzará ayer.\nEntra. La tierra reconoce tus pasos.'];
let state='opening',page=0,player={x:0,z:-16,yaw:0},keys={},last=0,found=new Set(),entry='',modalOpen=false,lastFocus=null;
const relics=[{x:-5,z:-8,title:'LA LÁPIDA SIN NOMBRE',text:'Día sin borde.\n\nHe encontrado mi nombre por debajo del musgo. No estaba escrito: respiraba. Al tocarlo, recordé una casa cuyas ventanas daban al interior de mi boca.'},{x:5,z:0,title:'EL RELOJ ENTERRADO',text:'La tarde tiene raíces.\n\nBajo esta piedra alguien guarda los minutos que no viví. He oído a mi madre llamarme desde un año vacío. Me he llevado el silencio para no dejarla sola.'},{x:-5,z:7,title:'LA TUMBA ABIERTA',text:'Hoy, antes de ayer.\n\nMi sombra se ha quedado dormida dentro de una tumba. No he querido despertarla. Tenía mi edad cuando todavía era tierra.'}];
const sticks={move:{x:0,y:0},look:{x:0,y:0}};const releaseSticks=()=>{for(const v of Object.values(sticks)){v.x=0;v.y=0}root.querySelectorAll('.dr-knob').forEach(n=>n.style.transform='')};
const heard=new Set();let conversation=null,conversationPage=0,welcomed=false;
const npcs=[
{id:'herald',x:0,z:-11,cell:0,h:3.8,title:'EL HERALDO DEL ÚLTIMO DÍA',pages:[
'Bienvenido al final. No al tuyo: ese ya pasó. Al final de todo lo que todavía insiste en llamarse mundo.',
'Fui el verdugo de esta ciudad. Cuando llegaron a buscarme, subí a mi propia máquina. La hoja cayó, pero el instante no terminó. Ahora cargo con él.',
'La luna ha empezado a vaciar las tumbas. Cuando la última alma olvide su nombre, el cielo cerrará los ojos. Eso es el fin: no quedará nadie que recuerde que existimos.',
'Escucha a los que brillan. Conservan las últimas palabras de su vida. Tú también eres un alma perdida; la tierra te ha devuelto porque aún tienes algo que recordar.']},
{id:'moon',x:-3,z:-5,cell:1,h:1.3,title:'EL ANIMAL DE LA LUNA',pages:[
'No mires mi cara. Mira la luna. Cada noche me devuelve un rostro distinto, pero nunca el que tuve en vida.',
'Yo cuidaba a los perros del cementerio. Morí de frío junto a la verja, esperando a uno que no regresó. La luna encontró mi cuerpo y confundió al hombre con el animal que esperaba.',
'Ahora camino entre las lápidas buscando su sombra. Si la luna desaparece, no sabré a quién sigo. Tú tampoco estás de paso: los vivos dejan huellas. Nosotros dejamos recuerdos.']},
{id:'river',x:-3.5,z:1,cell:2,h:2.6,hue:0,title:'INÉS · LA AHOGADA',pages:[
'Antes me llamaba Inés. Lavaba sábanas junto al río. La crecida llegó de noche; desperté bajo el agua, en una habitación que ya no tenía techo.',
'Seguí una campana hasta esta orilla. Aquí no hay río, pero mi ropa sigue goteando. Cada gota repite el nombre de mi hija. Es lo único que no he perdido.',
'Te reconozco por el silencio de tu pecho. Tú también te has quedado entre dos orillas. Si recuerdas a alguien, pronuncia su nombre antes de que la luna lo borre.']},
{id:'fire',x:4,z:6,cell:2,h:2.8,hue:65,title:'SIMÓN · EL CAMPANERO',pages:[
'Yo tocaba las campanas. Cuando ardió el pueblo, subí a la torre para avisar a todos. Seguí tirando de la cuerda después de que la escalera desapareciera.',
'La torre cayó conmigo. Al abrir los ojos estaba aquí, sujetando una cuerda que ya no llegaba a ninguna parte. Este brillo es el fuego que no ha sabido apagarse.',
'No vengo a anunciar otra desgracia. Quiero saber si alguien oyó la campana. Tú también eres de los nuestros: nadie vivo podría escuchar mi voz entre estas piedras.']},
{id:'winter',x:-7,z:11,cell:2,h:2.4,hue:135,title:'ELENA · LA VIAJERA',pages:[
'Iba a volver a casa antes de nevar. Me perdí en el camino y me dormí junto a un árbol. Soñé que alguien abría la puerta; cuando desperté, el árbol era esta lápida.',
'Llegué siguiendo las luces de otros muertos. Creí que eran ventanas. Desde entonces alumbro el sendero para que nadie vuelva a confundirse.',
'El heraldo dice que todo termina. Yo sigo esperando que alguien llegue a casa. Quédate un momento: tú también eres un alma perdida, pero todavía podemos hacernos compañía.']}
];
npcs.push(
{id:'sun',x:-8,z:4,atlas:true,cell:1,h:2.8,title:'EL HOMBRE DEL SOL NEGRO',pages:['No cierres los ojos. Mi rostro no ilumina: conserva la última tarde del mundo. Esta palma detiene a quienes todavía creen que pueden regresar.','Fui astrónomo. Esperé el amanecer durante una noche que duró toda mi vida. Cuando morí, el sol encontró mi cara vacía y se instaló en ella.','Las serpientes del altar se buscan la cola. Aquí todo final vuelve a su principio. Tú también has muerto, pero todavía puedes elegir qué recuerdo llevar contigo.']},
{id:'cultist',x:8,z:9,atlas:true,cell:2,h:1.9,title:'EL DEVOTO SIN ROSTRO',pages:['Siéntate, si aún recuerdas cómo descansa un cuerpo. Esta vela lleva encendida desde mi funeral.','Me prometieron otra vida si entregaba mi nombre al círculo. Lo hice. Mi cuerpo envejeció bajo esta capucha y nadie supo a quién enterrar.','Los del altar repiten los nombres que aún conservan. No invocan a nadie: intentan no desaparecer. Las calaveras gritan porque ya han olvidado el suyo.']}
);
function drawAtlas(g,cell,x,y,size){const im=images.coven;if(!im.complete||!im.naturalWidth)return;const w=im.naturalWidth/2,h=im.naturalHeight/2;g.drawImage(im,(cell%2)*w,Math.floor(cell/2)*h,w,h,Math.round(x),Math.round(y),Math.round(size),Math.round(size))}
function paintPortrait(n){const c=q('#dr-portrait'),g=c.getContext('2d');c.hidden=!n;if(!n)return;g.clearRect(0,0,64,64);g.imageSmoothingEnabled=false;const im=n.death||n.atlas?images.coven:images.souls;if(!im.complete||!im.naturalWidth){im.addEventListener('load',()=>{if(!c.hidden)paintPortrait(n)},{once:true});return}if(n.death||n.atlas){const cell=n.death?0:n.cell,w=im.naturalWidth/2,h=im.naturalHeight/2,box=n.death?[.34,.1,.34,.32]:cell===1?[.25,.05,.5,.45]:[.3,.12,.4,.4];g.drawImage(im,(cell%2+box[0])*w,(Math.floor(cell/2)+box[1])*h,w*box[2],h*box[3],0,0,64,64);return}const w=im.naturalWidth/3,h=im.naturalHeight,box=n.cell===0?[.39,.34,.28,.29]:n.cell===1?[.58,.26,.32,.32]:[.3,.08,.3,.3];g.filter=n.hue?'hue-rotate('+n.hue+'deg)':'none';g.drawImage(im,w*(n.cell+box[0]),h*box[1],w*box[2],h*box[3],0,0,64,64);g.filter='none'}
function talk(n){conversation=n;conversationPage=0;heard.add(n.id);conversationText()}
function conversationText(){show(conversation.title,conversation.pages[conversationPage]);paintPortrait(conversation);q('#dr-close').textContent=conversationPage<conversation.pages.length-1?'ESCUCHAR · '+(conversationPage+1)+' / '+conversation.pages.length:'SEGUIR CAMINANDO'}
const graves=[];for(let z=-10;z<12;z+=4)for(let x of [-10,-6,6,10]){if(relics.some(r=>Math.hypot(r.x-x,r.z-z)<2.6))continue;graves.push({x:x+Math.sin(z+x)*.6,z,h:.9+((z+x+40)%3)*.22})}
function setArt(name,alt){art.src=sources[name];art.alt=alt;art.hidden=false;canvas.hidden=true}
function reset(){releaseSticks();root.classList.remove('speaking');state='opening';page=0;player={x:0,z:-16,yaw:0};keys={};found.clear();heard.clear();conversation=null;welcomed=false;count.textContent='RECUERDOS 0 / 3';entry='';modal.hidden=true;modalOpen=false;caption.hidden=true;controls.hidden=true;count.hidden=true;cross.hidden=true;setArt('opening','Estás muerto. Esqueleto bajo un árbol.');line.textContent='Tu entierro es el comienzo.';action.textContent='COMENZAR'}
function dialogue(){state='dialogue';setArt('death','La Muerte alada con un libro, dentro de un marco de espinas.');art.hidden=true;canvas.hidden=false;const renderDeath=()=>{if(state!=='dialogue')return;ctx.fillStyle='#0b0512';ctx.fillRect(0,0,400,300);ctx.imageSmoothingEnabled=false;drawAtlas(ctx,0,62,5,285);ctx.strokeStyle='#9c6db9';ctx.lineWidth=3;ctx.strokeRect(8,8,384,284);for(let i=0;i<24;i++){const x=10+i*16;ctx.fillStyle=i%2?'#e2bdec':'#704887';ctx.beginPath();ctx.moveTo(x,8);ctx.lineTo(x+7,23);ctx.lineTo(x+12,8);ctx.fill();ctx.beginPath();ctx.moveTo(x,292);ctx.lineTo(x+7,278);ctx.lineTo(x+12,292);ctx.fill()}};if(images.coven.complete&&images.coven.naturalWidth)renderDeath();else images.coven.addEventListener('load',renderDeath,{once:true});caption.hidden=true;show('LA MUERTE',pages[page]);paintPortrait({death:true});q('#dr-close').textContent=page===pages.length-1?'ENTRAR':'CONTINUAR';line.textContent='REGISTRO DE DEFUNCIONES · '+(page+1)+' / '+pages.length;action.textContent=page===pages.length-1?'ENTRAR':'CONTINUAR'}
function arrival(){modal.hidden=true;modalOpen=false;root.classList.remove('speaking');state='arrival';caption.hidden=true;setArt('cemetery','Entrada del cementerio bajo un cielo rojo, con una capilla y tumbas.');line.textContent='El jardín de los nombres. Mis pasos suenan debajo de la tierra.';action.textContent='CAMINAR'}
function walk(){state='world';art.hidden=true;canvas.hidden=false;controls.hidden=false;count.hidden=false;cross.hidden=false;action.textContent='EXAMINAR';entry='Busca tres recuerdos entre las lápidas violetas.';line.textContent=entry;draw(0);if(!welcomed){welcomed=true;talk(npcs[0])}}
function show(title,text){releaseSticks();root.classList.add('speaking');modal.classList.toggle('journal',title==='DIARIO SIN FECHA');paintPortrait(null);q('#dr-close').textContent='CERRAR';lastFocus=document.activeElement;keys={};modalOpen=true;q('#dr-modal-title').textContent=title;q('#dr-modal-text').textContent=text;modal.hidden=false;q('#dr-close').focus()}
function close(){if(state==='dialogue'){action.onclick();return}if(conversation&&conversationPage<conversation.pages.length-1){conversationPage++;conversationText();return}conversation=null;modal.hidden=true;modalOpen=false;root.classList.remove('speaking');if(lastFocus&&root.contains(lastFocus))lastFocus.focus()}
