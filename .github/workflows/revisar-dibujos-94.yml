name: Revisión visual de dibujos e ilustraciones
on:
  push:
    paths:
      - '.github/workflows/revisar-dibujos-94.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  miniaturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Crear recortes para revisar 94 obras
        shell: bash
        run: |
          python - <<'PY'
          import json, math, base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          base=Path('casa-lux/planos-ambiente')
          imgs=json.loads((base/'catalogo.json').read_text(encoding='utf-8'))['images']
          out=Path('casa-lux/_revision_dibujos_94'); out.mkdir(exist_ok=True)
          fw='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          ff=ImageFont.truetype(fw,22)
          for block in range(math.ceil(len(imgs)/8)):
              canvas=Image.new('RGB',(1840,184),'#11131a')
              draw=ImageDraw.Draw(canvas)
              for j,entry in enumerate(imgs[block*8:(block+1)*8]):
                  n=block*8+j
                  path=base/entry['file']
                  with Image.open(path) as im:
                      im=ImageOps.exif_transpose(im).convert('RGB')
                      im=ImageOps.contain(im,(220,155),Image.Resampling.LANCZOS)
                  x=j*230+5
                  canvas.paste(im,(x+(220-im.width)//2,3+(155-im.height)//2))
                  draw.text((x+3,159),f'{n+1:02d}',font=ff,fill='white')
              buf=BytesIO()
              canvas.save(buf,'JPEG',quality=79,optimize=True)
              encoded=base64.b64encode(buf.getvalue()).decode('ascii')
              (out/f'fila_{block+1:02d}.b64').write_text(encoded,encoding='ascii')
              print('Fila',block+1,'imagenes',block*8+1,'-',min(len(imgs),block*8+8),'bytes',len(buf.getvalue()))
          PY
      - name: Guardar miniaturas numeradas para selección
        shell: bash
        run: |
          git config user.name "Casa de Lu Roth"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/_revision_dibujos_94/
          if ! git diff --cached --quiet; then
            git commit -m "Casa Lu: miniaturas para curaduria de dibujos"
            git pull --rebase origin main
            git push origin main
          fi
