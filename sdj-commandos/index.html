function pixelDisc(ctx,x,y,r,color){
  ctx.fillStyle=color;
  for(let yy=-Math.ceil(r);yy<=r;yy+=2){const half=Math.floor(Math.sqrt(Math.max(0,r*r-yy*yy))/2)*2;ctx.fillRect(Math.round(x-half),Math.round(y+yy),half*2+2,2)}
}
function buildBlastCels(){
  if(blastCels.length)return;
  for(let frame=0;frame<18;frame++){
    const c=document.createElement('canvas');c.width=c.height=128;const ctx=c.getContext('2d');
    const u=frame/17,spread=8+Math.sin(Math.min(1,u*1.6)*Math.PI*.65)*29;
    for(let i=0;i<9;i++){
      const a=i*Math.PI*2/9+.4,xx=64+Math.cos(a)*spread*.69,yy=73+Math.sin(a)*spread*.58-u*24;
      const rad=(13+((i*7)%8))*(.45+Math.sin(Math.min(1,u*2)*Math.PI*.7));
      pixelDisc(ctx,xx+3,yy+3,rad+2,'#302d2d');pixelDisc(ctx,xx,yy,rad,'#655d51');
      pixelDisc(ctx,xx-3,yy-4,rad*.72,'#a69b7b');pixelDisc(ctx,xx-5,yy-6,rad*.34,'#d5c5a0');
      if(frame<12){const fire=1-frame/15;pixelDisc(ctx,xx,yy+3,rad*.8*fire,'#9f341e');pixelDisc(ctx,xx-2,yy,rad*.63*fire,'#ef6425');pixelDisc(ctx,xx-4,yy-3,rad*.42*fire,'#ffa83b');pixelDisc(ctx,xx-5,yy-4,rad*.24*fire,'#ffe9a0')}
    }
    if(frame<5){pixelDisc(ctx,64,69,23-frame*3,'#fff7cf');pixelDisc(ctx,62,65,13-frame,'#ffffff')}
    if(frame<8){ctx.fillStyle='#ffc260';for(let i=0;i<10;i++){const a=i*Math.PI/5;ctx.fillRect(Math.round(64+Math.cos(a)*(18+frame*5)),Math.round(69+Math.sin(a)*(18+frame*4)),3,2)}}
    blastCels.push(c);
  }
}
