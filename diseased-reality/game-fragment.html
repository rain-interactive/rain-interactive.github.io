<div id="dr-game">
 <header><span>DISEASED REALITY <small>· 1995</small></span><button id="dr-reset" aria-label="Volver al inicio">REINICIAR</button></header>
 <div class="dr-stage">
  <img id="dr-art" alt="Estás muerto. Un esqueleto descansa bajo un árbol." src="assets/opening-1995.webp">
  <canvas id="dr-world" width="400" height="300" hidden aria-label="Cementerio tridimensional: camina entre las lápidas y reúne tres recuerdos."></canvas>
  <div class="dr-scan"></div>
  <div id="dr-caption" hidden aria-live="polite"></div>
  <div id="dr-count" hidden>RECUERDOS 0 / 3</div>
  <div id="dr-cross" hidden>+</div>
 </div>
 <div class="dr-console"><p id="dr-line" aria-live="polite">Tu entierro es el comienzo.</p><button id="dr-action">COMENZAR</button></div>
 <div id="dr-controls" hidden>
  <div class="dr-pad"><button data-key="ArrowLeft" aria-label="Girar izquierda">↶</button><button data-key="w" aria-label="Avanzar">↑</button><button data-key="ArrowRight" aria-label="Girar derecha">↷</button><button data-key="a" aria-label="Desplazar izquierda">←</button><button data-key="s" aria-label="Retroceder">↓</button><button data-key="d" aria-label="Desplazar derecha">→</button></div>
  <div class="dr-help">WASD: caminar · ← →: girar<br>E: examinar · J: diario<br><button id="dr-journal">DIARIO</button></div>
 </div>
 <div id="dr-modal" hidden role="dialog" aria-modal="true" aria-labelledby="dr-modal-title"><h2 id="dr-modal-title">DIARIO SIN FECHA</h2><p id="dr-modal-text"></p><button id="dr-close">CERRAR</button></div>
</div>
<style>
#dr-game{position:relative;max-width:960px;margin:auto;background:#08070d;color:#e6d8d4;font:14px/1.5 'Courier New',monospace;overflow:hidden;color-scheme:dark}#dr-game *{box-sizing:border-box}#dr-game [hidden]{display:none!important}#dr-game header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0d0911;letter-spacing:.08em;font-size:12px}#dr-game small{color:#9b838f}#dr-game button{background:#1a101e;color:#f1ded9;border:1px solid #83516b;padding:12px 16px;font:inherit;cursor:pointer;touch-action:manipulation;min-height:44px}#dr-game button:hover{background:#372039}#dr-game button:focus-visible{outline:2px solid #f5b6ea;outline-offset:-3px}#dr-game header button{font-size:11px;padding:8px}#dr-game .dr-stage{position:relative;aspect-ratio:4/3;background:#08050c;overflow:hidden}#dr-art,#dr-world{width:100%;height:100%;display:block;object-fit:fill;image-rendering:pixelated}#dr-game .dr-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0003 3px 4px);opacity:.4}#dr-caption{position:absolute;left:9%;right:9%;bottom:9%;background:#020103;color:#eee0d4;padding:10px;text-align:center;font-size:clamp(12px,2.4vw,20px);white-space:pre-line;min-height:18%;display:flex;justify-content:center;align-items:center}#dr-count{position:absolute;top:12px;left:12px;font-size:11px;background:#0b0713c9;padding:6px 9px;color:#e3bbd7}#dr-cross{position:absolute;top:47%;left:49%;opacity:.6}#dr-game .dr-console{padding:12px 16px;border-top:1px solid #452439;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:88px}#dr-line{margin:0;max-width:65%;font-size:13px}#dr-action{flex-shrink:0}#dr-controls{padding:10px 16px 16px;display:flex;justify-content:space-between;gap:15px;border-top:1px solid #261723}#dr-game .dr-pad{display:grid;grid-template-columns:repeat(3,48px);gap:4px}#dr-game .dr-pad button{padding:9px;touch-action:none;font-size:19px;user-select:none}#dr-game .dr-help{font-size:11px;color:#bba6b4;text-align:right}#dr-journal{margin-top:10px;font-size:11px!important}#dr-modal{position:absolute;inset:15% 6% auto;max-height:75%;overflow:auto;padding:24px;background:#100c16;border:1px solid #b779a6;box-shadow:0 0 0 100vmax #000a;z-index:4}#dr-modal h2{font-size:17px;color:#db9dbf}#dr-modal p{white-space:pre-line;line-height:1.7}#dr-game .dr-console button{max-width:45%}@media(max-width:450px){#dr-game header{letter-spacing:0}#dr-line{font-size:12px}#dr-game .dr-console{padding:10px;gap:8px}#dr-action{font-size:12px;padding:10px}#dr-caption{bottom:8%;font-size:12px;padding:6px}#dr-modal{padding:16px;inset:8% 4% auto;max-height:84%}}
</style>
<script>
(()=>{
const root=document.getElementById('dr-game'),q=s=>root.querySelector(s),art=q('#dr-art'),canvas=q('#dr-world'),ctx=canvas.getContext('2d'),line=q('#dr-line'),action=q('#dr-action'),caption=q('#dr-caption'),controls=q('#dr-controls'),count=q('#dr-count'),cross=q('#dr-cross'),modal=q('#dr-modal');
const sources={opening:'assets/opening-1995.webp',death:'assets/death-1995.webp',cemetery:'assets/cemetery-1995.webp'};
const images={};Object.entries(sources).forEach(([name,src])=>{const im=new Image();im.src=src;images[name]=im});
const pages=['Tu nombre ha llegado antes que tú.\nEl jardín lleva años soñando con tus huesos.','Buenas noches.\nLa causa de tu muerte todavía no ha ocurrido.','Tu cadáver ha sido asignado a otra persona.\nLos recuerdos pertenecen al propietario anterior.','Tu entierro comenzará ayer.\nEntra. La tierra reconoce tus pasos.'];
let state='opening',page=0,player={x:0,z:-16,yaw:0},keys={},last=0,found=new Set(),entry='',modalOpen=false,lastFocus=null;
const relics=[{x:-5,z:-8,title:'LA LÁPIDA SIN NOMBRE',text:'Día sin borde.\n\nHe encontrado mi nombre por debajo del musgo. No estaba escrito: respiraba. Al tocarlo, recordé una casa cuyas ventanas daban al interior de mi boca.'},{x:5,z:0,title:'EL RELOJ ENTERRADO',text:'La tarde tiene raíces.\n\nBajo esta piedra alguien guarda los minutos que no viví. He oído a mi madre llamarme desde un año vacío. Me he llevado el silencio para no dejarla sola.'},{x:-5,z:7,title:'LA TUMBA ABIERTA',text:'Hoy, antes de ayer.\n\nMi sombra se ha quedado dormida dentro de una tumba. No he querido despertarla. Tenía mi edad cuando todavía era tierra.'}];
const graves=[];for(let z=-10;z<12;z+=4)for(let x of [-10,-6,6,10]){if(relics.some(r=>Math.hypot(r.x-x,r.z-z)<2.6))continue;graves.push({x:x+Math.sin(z+x)*.6,z,h:.9+((z+x+40)%3)*.22})}
function setArt(name,alt){art.src=sources[name];art.alt=alt;art.hidden=false;canvas.hidden=true}
function reset(){state='opening';page=0;player={x:0,z:-16,yaw:0};keys={};found.clear();count.textContent='RECUERDOS 0 / 3';entry='';modal.hidden=true;modalOpen=false;caption.hidden=true;controls.hidden=true;count.hidden=true;cross.hidden=true;setArt('opening','Estás muerto. Esqueleto bajo un árbol.');line.textContent='Tu entierro es el comienzo.';action.textContent='COMENZAR'}
function dialogue(){state='dialogue';setArt('death','La Muerte alada con un libro, dentro de un marco de espinas.');caption.hidden=false;caption.textContent=pages[page];line.textContent='REGISTRO DE DEFUNCIONES · '+(page+1)+' / '+pages.length;action.textContent=page===pages.length-1?'ENTRAR':'CONTINUAR'}
function arrival(){state='arrival';caption.hidden=true;setArt('cemetery','Entrada del cementerio bajo un cielo rojo, con una capilla y tumbas.');line.textContent='El jardín de los nombres. Mis pasos suenan debajo de la tierra.';action.textContent='CAMINAR'}
function walk(){state='world';art.hidden=true;canvas.hidden=false;controls.hidden=false;count.hidden=false;cross.hidden=false;action.textContent='EXAMINAR';entry='Busca tres recuerdos entre las lápidas violetas.';line.textContent=entry}
function show(title,text){lastFocus=document.activeElement;keys={};modalOpen=true;q('#dr-modal-title').textContent=title;q('#dr-modal-text').textContent=text;modal.hidden=false;q('#dr-close').focus()}
function close(){modal.hidden=true;modalOpen=false;if(lastFocus&&root.contains(lastFocus))lastFocus.focus()}
function nearest(){let result=null,best=3;relics.forEach((r,i)=>{let d=Math.hypot(player.x-r.x,player.z-r.z);if(d<best){best=d;result={...r,index:i}}});if(Math.hypot(player.x,player.z-13)<3.4)result={chapel:true};return result}
function inspect(){const n=nearest();if(!n){entry='La tierra guarda silencio. Acércate a una lápida violeta.';return}if(n.chapel){if(found.size<3){show('LA CAPILLA','La puerta tiene tres huecos con la forma de un recuerdo.\n\nTodavía me faltan '+(3-found.size)+'.');return}state='ending';controls.hidden=true;cross.hidden=true;action.textContent='VOLVER AL JARDÍN';show('EL NOMBRE AL OTRO LADO','He devuelto los tres recuerdos.\n\nLa puerta no se ha abierto. He sido yo quien se ha vuelto hueco.\n\nDesde dentro, alguien pronuncia mi nombre con la voz de la lluvia.\n\nFIN DEL PRIMER RECORRIDO');line.textContent='La capilla ya sabe quién eres.';return}found.add(n.index);count.textContent='RECUERDOS '+found.size+' / 3';entry=found.size===3?'Los tres recuerdos están contigo. Regresa a la capilla.':'Recuerdo guardado en tu diario.';show(n.title,n.text)}
action.onclick=()=>{if(state==='opening'){page=0;dialogue()}else if(state==='dialogue'){if(++page<pages.length)dialogue();else arrival()}else if(state==='arrival')walk();else if(state==='world')inspect();else if(state==='ending'){state='world';controls.hidden=false;cross.hidden=false;action.textContent='EXAMINAR'}};
q('#dr-reset').onclick=reset;q('#dr-close').onclick=close;q('#dr-journal').onclick=()=>show('DIARIO SIN FECHA',found.size?[...found].map(i=>relics[i].title+'\n'+relics[i].text).join('\n\n— — —\n\n'):'Las páginas están húmedas. Todavía no recuerdo nada.');
root.addEventListener('keydown',e=>{if(modalOpen){if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();q('#dr-close').focus()}return}const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','e','j',' '].includes(k)){e.preventDefault();if(state==='world'){keys[k]=true;if(!e.repeat&&k==='e')inspect();if(!e.repeat&&k==='j')q('#dr-journal').click()}}});
window.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});window.addEventListener('blur',()=>keys={});document.addEventListener('visibilitychange',()=>keys={});
q('.dr-pad').querySelectorAll('button').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys[b.dataset.key]=true;step(b.dataset.key);b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>{keys[b.dataset.key]=false}});
let seed=137;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const stars=Array.from({length:65},()=>[rand()*400,rand()*125,rand()]);
const faces=[];function project(v){let dx=v[0]-player.x,dz=v[2]-player.z,cs=Math.cos(player.yaw),sn=Math.sin(player.yaw);let depth=dz*cs+dx*sn;return {x:200+(dx*cs-dz*sn)*235/depth,y:155-(v[1]-1.55)*235/depth,z:depth}}
function face(points,color){const p=points.map(project);if(p.some(v=>v.z<.13))return;const depth=p.reduce((s,v)=>s+v.z,0)/p.length;faces.push({p,color,depth})}
function box(x,y,z,w,h,d,color){const a=[x-w/2,y,z-d/2],b=[x+w/2,y,z-d/2],c=[x+w/2,y,z+d/2],e=[x-w/2,y,z+d/2];const top=v=>[v[0],v[1]+h,v[2]];face([a,b,top(b),top(a)],color);face([b,c,top(c),top(b)],color.map(v=>v*.72));face([c,e,top(e),top(c)],color.map(v=>v*.8));face([e,a,top(a),top(e)],color.map(v=>v*.6));face([top(a),top(b),top(c),top(e)],color.map(v=>v*1.1))}
function tomb(x,z,h,special=false,taken=false){box(x,0,z,1,.16,1.7,[40,43,43]);box(x,.1,z+.3,.75,h,.24,special?(taken?[82,66,85]:[125,77,145]):[67,72,88]);box(x,.3+h,z+.3,.92,.13,.3,special?[110,76,131]:[64,68,82]);if(special){box(x,.6,z+.14,.1,.45,.05,[190,152,191]);box(x,.81,z+.13,.34,.08,.05,[190,152,191])}}
function draw(t){ctx.fillStyle='#360c21';ctx.fillRect(0,0,400,300);for(let i=0;i<12;i++){ctx.fillStyle=`rgb(${85-i*4},${9+i},${31+i})`;ctx.fillRect(0,i*13,400,14)}stars.forEach(([x,y,s])=>{ctx.fillStyle=s>.7?'#ae5678':'#6f2a49';ctx.fillRect((x-player.yaw*150%400+800)%400,y,1,1)});ctx.fillStyle='#15151b';ctx.fillRect(0,155,400,145);faces.length=0;
for(let z=-20;z<22;z+=2)for(let x=-14;x<14;x+=2){let path=Math.abs(x)<2;let v=((x*17+z*31+4000)%13);face([[x,0,z],[x+2,0,z],[x+2,0,z+2],[x,0,z+2]],path?[43+v,39+v,46+v]:[20+v/2,29+v,29+v/2])}
graves.forEach(g=>tomb(g.x,g.z,g.h));relics.forEach((r,i)=>tomb(r.x,r.z,1.7,true,found.has(i)));
box(0,0,16,5,5,5,[53,57,77]);box(0,5,17,2.2,3,2.2,[61,62,83]);face([[-3,5,13.5],[3,5,13.5],[0,7.5,13.5]],[71,57,78]);face([[-1.3,8,15.7],[1.3,8,15.7],[0,11,16.8]],[50,35,59]);box(0,8,16.8,.13,4,.13,[78,66,83]);box(0,10.7,16.8,1,.12,.12,[78,66,83]);box(0,0,13.46,1.6,2.8,.06,[5,4,11]);face([[-.8,2.8,13.4],[.8,2.8,13.4],[0,3.6,13.4]],[5,4,11]);box(0,3.8,13.4,.6,.6,.08,[121,25,59]);
for(let z=-18;z<23;z+=5)for(let x of [-13,13]){box(x,0,z,.45,5,.45,[28,24,34]);face([[x,2,z],[x-2,6,z],[x-.6,4,z]],[26,20,30]);face([[x,3,z],[x+1.9,7,z+.2],[x+.5,4.4,z]],[31,22,35])}
box(-14,0,0,.4,2,42,[39,35,48]);box(14,0,0,.4,2,42,[39,35,48]);box(0,0,21,28,2,.4,[39,35,48]);
faces.sort((a,b)=>b.depth-a.depth);for(const f of faces){let fog=Math.min(.84,Math.max(0,(f.depth-4)/34));const c=f.color.map((v,i)=>Math.round(v*(1-fog)+[36,18,39][i]*fog));ctx.fillStyle=`rgb(${c})`;ctx.beginPath();f.p.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill()}
for(let y=180;y<300;y+=4){ctx.fillStyle='#0000000b';ctx.fillRect(0,y,400,1)}ctx.fillStyle='#100a1860';ctx.fillRect(0,0,12,300);ctx.fillRect(388,0,12,300);
}
function step(k){if(state!=='world'||modalOpen)return;if(k==='ArrowLeft'){player.yaw-=.16;return}if(k==='ArrowRight'){player.yaw+=.16;return}const f=k==='w'?1:k==='s'?-1:0,r=k==='d'?1:k==='a'?-1:0;const dx=(Math.sin(player.yaw)*f+Math.cos(player.yaw)*r)*.5,dz=(Math.cos(player.yaw)*f-Math.sin(player.yaw)*r)*.5;if(!blocked(player.x+dx,player.z))player.x+=dx;if(!blocked(player.x,player.z+dz))player.z+=dz}
function blocked(x,z){return Math.abs(x)>12||z< -18||z>19||(Math.abs(x)<3&&z>13)||[...graves,...relics].some(g=>Math.abs(x-g.x)<.7&&Math.abs(z-g.z)<.85)}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(state==='world'&&!modalOpen){player.yaw+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*dt*1.8;let forward=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0),strafe=(keys.d?1:0)-(keys.a?1:0),norm=Math.hypot(forward,strafe)||1;let dx=(Math.sin(player.yaw)*forward+Math.cos(player.yaw)*strafe)*dt*3.5/norm,dz=(Math.cos(player.yaw)*forward-Math.sin(player.yaw)*strafe)*dt*3.5/norm;if(!blocked(player.x+dx,player.z))player.x+=dx;if(!blocked(player.x,player.z+dz))player.z+=dz;const n=nearest();line.textContent=n?(n.chapel?'LA CAPILLA · '+(found.size===3?'Devuelve los recuerdos.':'Tres recuerdos abrirán el umbral.'):n.title+' · EXAMINAR'):entry;draw(t)}requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
})();
</script>
