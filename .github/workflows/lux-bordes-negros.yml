name: Casa de Lux · sustituir rellenos por negro
on:
  push:
    paths:
      - '.github/workflows/lux-bordes-negros.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lux-bordes-negros-apply
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Transformar bordes desenfocados a negro, sin recortar las fotos
        run: python casa-lux/aplicar_bordes_negros.py
      - name: Verificar 66 planos y conservar la instalación interactiva
        run: |
          python - <<'PY'
          import json,re,io,base64
          from PIL import Image
          from pathlib import Path
          root=Path("casa-lux")
          h=(root/"index.html").read_text("utf8")
          m=re.search(r'const scenes=(\[.*?\]);',h,re.S)
          assert m and len(json.loads(m.group(1)))==66
          for piece in ["chat.js","radio.js","windfinder.js","cornerClock","monocromo.css"]:
              assert piece in h,piece
          info=json.loads((root/"bordes_negros_aplicados.json").read_text("utf8"))
          assert info["final_count"]==66 and len(info["modified_indices"])==31
          for n in range(13,30):
              s=(root/"assets"/f"pack_{n:02d}.js").read_text("utf8")
              for idx,blob in re.findall(r'window\.__luxImages\[(\d+)\]="data:image/webp;base64,([A-Za-z0-9+/=]+)";',s):
                  with Image.open(io.BytesIO(base64.b64decode(blob))) as im:
                      assert im.size==(1920,1080),idx
          print("OK · 66 escenas · 31 fondos negros · interfaz y Windfinder conservados")
          PY
      - name: Publicar cambios y lámina visual de control
        run: |
          git config user.name "Casa de Lux"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/assets/pack_*.js casa-lux/bordes_negros_aplicados.json casa-lux/bordes_negros_miniaturas.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Sustituir fondos desenfocados por negro sólido en fotografías verticales"
            git push
          fi
