let language='es';try{language=localStorage.getItem(KEY)==='en'?'en':'es'}catch{}
const escape=s=>[...s].map(c=>'.*+?^${}()|[]'.includes(c)||c.charCodeAt(0)===92?String.fromCharCode(92)+c:c).join('');
function make(entries){
  const map=new Map(entries),pattern=new RegExp([...map.keys()].sort((a,b)=>b.length-a.length).map(escape).join('|'),'g');
  return value=>String(value).replace(pattern,key=>map.get(key));
}

pairs.push(...[["Más daño y cadencia para este ataque.", "More damage and fire rate for this attack."], ["Más daño, radio y frecuencia de granadas.", "More grenade damage, blast radius and frequency."], ["Minas más frecuentes y potentes.", "More frequent and powerful mines."], ["Más cobertura y daño alrededor del jinete.", "More coverage and damage around the rider."], ["Ocupa la tercera plaza. Protege tu retirada.", "Uses the third slot. Protects your retreat."], ["Ocupa la tercera plaza. Golpea enemigos cercanos.", "Uses the third slot. Hits nearby enemies."], ["Ocupa la tercera plaza. Dispara junto al arma inicial.", "Uses the third slot. Fires alongside the starting weapon."], ["Todos los fusiles disparan más rápido.", "All firearms shoot faster."], ["Más daño para todos tus ataques.", "More damage for all your attacks."], ["Un proyectil adicional por disparo.", "One extra projectile per shot."], ["Atraes experiencia y cofres desde más lejos.", "Attract experience and chests from farther away."], ["Disponible para equipar y para la siguiente partida.", "Available to equip and for the next run."], ["Recuperas vida y recibes 150 puntos.", "Restore health and receive 150 points."], ["Las explosiones dejan fuego que sigue dañando.", "Explosions leave fire that keeps dealing damage."], ["Una detonación activa las minas próximas.", "A detonation triggers nearby mines."], ["Un anillo amplio golpea y frena a los enemigos.", "A wide ring hits and slows enemies."], ["Dos proyectiles explosivos cubren un área mayor.", "Two explosive projectiles cover a larger area."], ["Un haz rápido atraviesa enemigos y frena su avance.", "A rapid beam pierces enemies and slows their advance."], ["Un abanico de cuchillas abre espacio a corta distancia.", "A fan of blades clears space at close range."], ["Proyectiles rápidos que atraviesan varios enemigos.", "Fast projectiles that pierce multiple enemies."], ["Completa recetas para evolucionar tus ataques.", "Complete recipes to evolve your attacks."], ["Disparas automáticamente. Tres ataques combinables.", "You fire automatically. Combine three attacks."], ["Mejora ataques, completa recetas y abre cofres de élite.", "Upgrade attacks, complete recipes and open elite chests."], ["RÁFAGA PERFORANTE", "PIERCING BURST"], ["SALVA EXPLOSIVA", "EXPLOSIVE SALVO"], ["HAZ CONTINUO", "CONTINUOUS BEAM"], ["ABANICO DE CUCHILLAS", "BLADE FAN"], ["NAPALM PERSISTENTE", "PERSISTENT NAPALM"], ["CADENA DE MINAS", "MINE CHAIN"], ["ANILLO GUARDIÁN", "GUARDIAN RING"], ["ÁREA EXPLOSIVA", "BLAST AREA"], ["PENETRACIÓN", "PENETRATION"], ["CONDENSADOR", "CAPACITOR"], ["AFILADO", "SHARPENING"], ["DETONADOR", "DETONATOR"], ["DURACIÓN", "DURATION"], ["ÓRBITAS", "ORBITS"], ["MINAS", "MINES"], ["AÑADIR ", "ADD "], ["CADENCIA GLOBAL", "GLOBAL FIRE RATE"], ["DAÑO GLOBAL", "GLOBAL DAMAGE"], ["SUMINISTROS", "SUPPLIES"], ["EVOLUCIONADA", "EVOLVED"], ["LISTA PARA COFRE", "READY FOR CHEST"], ["EVOLUCIÓN DESBLOQUEADA", "EVOLUTION UNLOCKED"], ["COFRE DE ÉLITE", "ELITE CHEST"], ["ÉLITE · COFRE", "ELITE · CHEST"], ["COFRES:", "CHESTS:"], ["EVOLUCIONES:", "EVOLUTIONS:"], ["AVANZADA", "VANGUARD"], ["IRRUPCIÓN", "RUSH"], ["CERCO", "ENCIRCLEMENT"], ["ASALTO PESADO", "HEAVY ASSAULT"], ["ÚLTIMA OLEADA", "FINAL WAVE"], ["COFRE", "CHEST"], ["ARSENAL", "ARSENAL"]]);

const saved=new WeakMap();
function updateValue(node,key,read,write){
  const current=read();if(!current)return;
  let memory=saved.get(node);if(!memory){memory={};saved.set(node,memory)}
  let item=memory[key];
  if(!item||current!==item.rendered)item=memory[key]={original:current,rendered:current};
  const translated=window.commandosT(item.original);
  item.rendered=translated;if(current!==translated)write(translated);
}
function translate(root){
  if(root.nodeType===3){
    if(!root.parentElement?.closest('script,style,#commandos-language'))updateValue(root,'text',()=>root.nodeValue,v=>root.nodeValue=v);
    return;
  }
  if(root.nodeType!==1&&root.nodeType!==9)return;
  if(root.nodeType===1){
    if(root.matches('script,style,#commandos-language'))return;
    for(const attr of ['aria-label','title','placeholder','alt'])
      if(root.hasAttribute(attr))updateValue(root,attr,()=>root.getAttribute(attr),v=>root.setAttribute(attr,v));
  }
  for(const child of root.childNodes)translate(child);
}
function select(next){
  language=next;try{localStorage.setItem(KEY,language)}catch{}
  document.documentElement.lang=language;
  translate(document.body);translate(document.querySelector('title'));
  document.querySelectorAll('#commandos-language button').forEach(b=>{
    const active=b.dataset.language===language;b.setAttribute('aria-pressed',String(active));b.style.color=active?'#75d2c7':'#aaa';
  });
}
function mount(){
  const bar=document.createElement('div');bar.id='commandos-language';bar.setAttribute('role','group');bar.setAttribute('aria-label','Idioma / Language');

  for(const code of ['es','en']){
    const b=document.createElement('button');b.type='button';b.dataset.language=code;b.textContent=code.toUpperCase();
    b.style.cssText='width:auto;margin:0;min-width:36px;min-height:32px;padding:5px;border:0;background:transparent;font:bold 12px monospace;letter-spacing:0;cursor:pointer;touch-action:manipulation';
    b.onclick=()=>select(code);bar.append(b);
  }
  (screen||document.body).append(bar);
  // The cover overlay is outside the cabinet, and sits above all other controls.
  const cover=document.querySelector('#commandos-cover-start');if(cover)cover.append(bar);
  select(language);
  new MutationObserver(records=>{
    for(const item of records){
      if(item.type==='childList')for(const node of item.addedNodes)translate(node);
      else translate(item.target);
    }
  }).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title','placeholder','alt']});
  if(cover)new MutationObserver(()=>{if(!cover.isConnected&&bar.parentNode===cover)(screen||document.body).append(bar)}).observe(document.body,{childList:true});
}
