name: Auditar resoluciones de planos ambiente · Casa Lu
on:
  push:
    paths:
      - '.github/workflows/auditar-resolucion-ambiente-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Medir tamaño de todas las fuentes de imagen
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          folder=Path('casa-lux/planos-ambiente')
          result=[]
          for path in sorted(folder.iterdir()):
              if path.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}:
                  continue
              try:
                  with Image.open(path) as im:
                      width,height=im.size
                      format=im.format
              except Exception as exc:
                  width,height,format=0,0,'ERROR: '+str(exc)
              # A 16:9 screen needs native pixels in each dimension to avoid upscaling.
              cover=min(width/1920,height/1080)
              result.append({'file':path.name,'width':width,'height':height,
                             'format':format,'bytes':path.stat().st_size,
                             'native_fhd':width>=1920 and height>=1080,
                             'cover_scale':round(cover,3)})
          report={'total':len(result),'native_fhd_count':sum(x['native_fhd'] for x in result),
                  'images':result}
          output=folder/'resoluciones-auditoria.json'
          output.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Total:',len(result),'Native FHD:',report['native_fhd_count'])
          for item in result:print(item['width'],item['height'],item['file'])
          PY
      - name: Registrar auditoría de dimensiones
        shell: bash
        run: |
          git config user.name "Casa de Lu Roth"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/planos-ambiente/resoluciones-auditoria.json
          if ! git diff --cached --quiet; then
            git commit -m "Casa Lu: registrar resoluciones originales de planos ambiente"
            git pull --rebase origin main
            git push origin main
          fi
