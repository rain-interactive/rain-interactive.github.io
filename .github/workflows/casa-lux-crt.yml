name: Casa de Lux - preparar imagenes CRT
on:
  workflow_dispatch:
  push:
    paths:
      - 'casa-lux/index.html'
      - 'casa-lux/crt.html'
      - 'casa-lux/generar_crt.py'
      - 'casa-lux/planos-ambiente/catalogo.json'
permissions:
  contents: write
concurrency:
  group: casa-lux-crt-images
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Crear copias CRT 640x480 sin modificar originales
        run: python casa-lux/generar_crt.py
      - name: Publicar miniaturas y manifiesto
        shell: bash
        run: |
          git config user.name "Rain Interactive · CRT"
          git config user.email "actions@users.noreply.github.com"
          git add -A casa-lux/crt-assets
          if ! git diff --cached --quiet; then
            git commit -m "Casa Lux: generar imágenes de bajo consumo para CRT"
            git pull --rebase origin main
            git push origin main
          fi
