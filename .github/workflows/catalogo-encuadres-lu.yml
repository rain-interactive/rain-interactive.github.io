name: Catalogo cinematografico Casa de Lu Roth
on:
  push:
    paths:
      - 'casa-lux/index.html'
      - 'casa-lux/generar_catalogo_cine.py'
      - '.github/workflows/catalogo-encuadres-lu.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - name: Generar JPG de todos los planos existentes con sus encuadres cinematograficos
        run: python casa-lux/generar_catalogo_cine.py
      - name: Publicar el JPG en Casa de Lu Roth
        run: |
          git config user.name "Casa de Lu Roth"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/catalogo_encuadres_cine.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catalogo JPG de todos los encuadres"
            git pull --rebase origin main
            git push origin main
          fi
