name: Instalar archivo ambiental 01 de Casa Lu Roth
on:
  push:
    paths:
      - '.github/workflows/instalar-planos-ambientales-lu.yml'
      - 'casa-lux/casa_lu_planos_ambientales_01.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar y extraer los siete JPG
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          source=Path('casa-lux/casa_lu_planos_ambientales_01.zip')
          assert source.is_file(), 'Falta el ZIP ambiental'
          expected=[
            'ambient_01_silos_brutalistas.jpg',
            'ambient_02_ciudad_digital_deformada.jpg',
            'ambient_03_escaleras_rojas.jpg',
            'ambient_04_metro_125_street.jpg',
            'ambient_05_lavanderia_turquesa.jpg',
            'ambient_06_crt_neon.jpg',
            'ambient_07_muro_monitores.jpg',
          ]
          with ZipFile(source) as z:
            for name in expected:
              rel='casa-lux/assets/'+name
              data=z.read(rel)
              assert len(data)>10000 and data[:3]==bytes.fromhex('ffd8ff'), 'JPG inválido: '+name
              destination=Path(rel)
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(data)
              print('Instalado:',rel,len(data))
          html=Path('casa-lux/index.html').read_text(encoding='utf-8')
          assert all(name in html for name in expected),'Faltan referencias de imágenes en el catálogo'
          PY
      - name: Publicar JPG extraídos
        shell: bash
        run: |
          git config user.name "Casa de Lu Roth"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/assets/ambient_*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Casa Lu: publicar siete planos ambientales de los 2000"
            git pull --rebase origin main
            git push origin main
          fi
