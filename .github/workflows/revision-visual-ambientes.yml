name: Preparar miniaturas para curaduria de ambientes
on:
  push:
    paths:
      - '.github/workflows/revision-visual-ambientes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Cortar hoja de contactos en ocho grupos de ocho
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64
          sheet=Image.open('casa-lux/catalogo-ambientes.jpg').convert('RGB')
          out=Path('casa-lux/_revision_ambientes')
          out.mkdir(exist_ok=True)
          assert sheet.width>=2690 and sheet.height>=2000,(sheet.width,sheet.height)
          for row in range(8):
              y=130+row*238
              part=sheet.crop((0,y,2696,y+238))
              part.thumbnail((1850,180),Image.Resampling.LANCZOS)
              buf=BytesIO()
              part.save(buf,format='JPEG',quality=72,optimize=True)
              content=base64.b64encode(buf.getvalue()).decode('ascii')
              path=out/f'fila_{row+1:02d}.b64'
              path.write_text(content,encoding='ascii')
              print(path,'JPEG bytes:',len(buf.getvalue()),'base64 characters:',len(content))
          PY
      - name: Guardar miniaturas de revisión
        shell: bash
        run: |
          git config user.name "Casa de Lu Roth"
          git config user.email "actions@users.noreply.github.com"
          git add casa-lux/_revision_ambientes/
          if ! git diff --cached --quiet; then
            git commit -m "Casa Lu: miniaturas temporales para selección artística"
            git pull --rebase origin main
            git push origin main
          fi
